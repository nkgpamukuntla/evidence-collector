# Prod: release tag v*.*.* -> build/push image to prod ECR -> plan -> apply.
# GitHub Environment "prod" must require Tim's approval.
# TODO: pin every action to a commit SHA before merging.
name: infra-prod
on:
  push:
    tags: ["v*.*.*"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-prod
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push linux/arm64 (tag must equal infra/envs/prod.image)
        run: |
          TAG="$(cat infra/envs/prod.image)"
          IMAGE="${{ steps.ecr.outputs.registry }}/ec-prod-collector:${TAG}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then echo "exists"; exit 0; fi
          docker build --platform linux/arm64 -t "$IMAGE" .
          docker push "$IMAGE"

  terraform:
    needs: image
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: echo "${{ secrets.TFVARS_B64 }}" | base64 -d > "$RUNNER_TEMP/env.tfvars"
      - run: terraform -chdir=infra init -input=false -backend-config=envs/prod.backend.hcl
      - run: terraform -chdir=infra plan -input=false -var-file="$RUNNER_TEMP/env.tfvars" -out=tfplan
      - run: terraform -chdir=infra apply -input=false tfplan
